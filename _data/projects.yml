- title: Multi-Chain Non-Custodial Wallet Backend
  description: Designed and implemented a non-custodial wallet backend supporting Solana, Base, Ethereum, and BSC chains. Handles ~IDR 1B monthly transaction volume with idempotent operations and compensation-based failure recovery to guarantee zero fund loss under concurrent cross-chain operations.
  technologies:
    - Java
    - Spring Boot
    - PostgreSQL
    - GCP
    - Pub/Sub
    - Solana
    - Ethereum
    - BSC
  image: wallet.png
  highlights:
    - Supports Solana, Base, Ethereum, and BSC chains in a single unified backend
    - Idempotent operations prevent duplicate transactions under retries
    - Compensation-based failure recovery ensures zero fund loss on partial failures
    - ~IDR 1B monthly transaction volume handled in production

- title: KYC Async Verification Pipeline
  description: Redesigned a synchronous, vendor-coupled KYC verification flow into an async, event-driven pipeline using Pub/Sub with multi-stage fallback logic. Eliminated cascading timeout failures caused by upstream vendor latency spikes and cut false KYC rejections by ~40%.
  technologies:
    - Java
    - Spring Boot
    - GCP Pub/Sub
    - PostgreSQL
  image: kyc.png
  highlights:
    - Reduced KYC false rejections by ~40%
    - Decoupled from vendor latency via async Pub/Sub pipeline
    - Multi-stage fallback logic prevents single point of failure
    - Improved customer onboarding reliability at scale

- title: User Self-Service Authentication & Recovery
  description: Built automated account recovery workflows and self-service backend processes for 2FA reset and phone number changes without requiring login. Reduced 2FA-related support tickets by ~78% and significantly cut manual operational load across the platform.
  technologies:
    - Java
    - Spring Boot
    - JWT
    - Email/SMS Services
    - PostgreSQL
  image: auth.png
  highlights:
    - Reduced 2FA-related support tickets by ~78%
    - Eliminated login requirement for account recovery flows
    - Multi-channel verification for security
    - Comprehensive audit logging for compliance

- title: User Tiering Pipeline (5M Users)
  description: Designed and implemented a daily batch pipeline that processes ~5M users based on AUM and transaction volume to assign tiering classifications. Resolved critical performance bottlenecks through concurrency tuning and SQL connection pool optimization.
  technologies:
    - Java
    - Spring Boot
    - PostgreSQL
    - Redis
  image: tiering.png
  highlights:
    - Processes ~5M users daily in a scheduled batch
    - Concurrency tuning resolved critical throughput bottlenecks
    - SQL connection pool optimization reduced database contention
    - AUM and transaction volume as tiering classification signals

- title: Zero-Downtime PostgreSQL Migration
  description: Executed a zero-downtime migration of a 5M-row PostgreSQL table using a dual-write pattern combined with bulk backfill and rigorous data consistency validation, completing the migration with no service interruption.
  technologies:
    - Java
    - PostgreSQL
    - GCP
  image: migration.png
  highlights:
    - Zero service downtime throughout the migration
    - Dual-write pattern ensured no data loss during cutover
    - Bulk backfill with consistency validation for 5M rows
    - Rollback-safe approach throughout the process

- title: Alerta - Incident Management System
  description: Built an incident management backend platform in Go for TechConnect (Sinarmas Group), integrating Slack, Jira, and Confluence. Implemented end-to-end alert ingestion pipelines, routing logic, and escalation workflows used by internal operations teams.
  technologies:
    - Golang
    - Kubernetes
    - GCP
    - Helm
    - Terraform
    - Slack API
    - Jira API
    - Confluence API
  image: alerta.png
  highlights:
    - End-to-end alert ingestion and routing pipeline
    - On-call scheduling and escalation policies
    - Integrations with Slack, Jira, and Confluence
    - Deployed on Kubernetes with Helm and Terraform

- title: Angkat Tani - Agricultural Support System
  description: Developed "Angkat Tani" as part of Bangkit Academy, an application to help Indonesian farmers by predicting crop prices and detecting plant diseases from leaf photos using machine learning.
  technologies:
    - Python
    - Google Cloud Platform
    - Machine Learning
    - Android Development
  image: angkat-tani.png
  highlights:
    - Crop price prediction using historical data analysis
    - Plant disease detection from leaf photos via ML
    - Available as Android and web applications
    - Supports informed crop planting and treatment decisions
