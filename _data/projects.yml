- title: KYC One-to-Many Face Search System  
  description: Developed a one-to-many face search functionality for KYC verification to address false negative face matches from Dukcapil. By implementing an additional verification layer with third-party face recognition services, we successfully reduced cases where legitimate users were incorrectly rejected during KYC verification.  
  technologies:  
    - Java  
    - Spring Boot  
    - PostgreSQL  
  image: kyc.png  
  highlights:  
    - Solved false negative face match issues from Dukcapil verification
    - Implemented additional verification layer with third-party face recognition
    - Reduced incorrect KYC rejections for legitimate users
    - Improved customer onboarding experience
    - Decreased manual review workload for support team

- title: User Self-Service Authentication
  description: Implemented secure methods for users to reset 2FA and change phone numbers without requiring login. This solution significantly reduced customer support tickets and streamlined the authentication process, improving user satisfaction for account management features.
  technologies:
    - Java
    - Spring Boot
    - JWT
    - Email/SMS Services
  image: auth.png
  highlights:
    - Significantly reduced customer support workload through automated self-service
    - Enhanced user experience by eliminating login requirements for account recovery
    - Improved security with multi-channel verification process
    - Reduced operational costs by automating support processes
    - Implemented comprehensive audit logging for security tracking

- title: Customer PII Data Encryption
  description: Designed and implemented an encryption system for customer personally identifiable information (PII), ensuring compliance with data protection regulations. The system achieved full compliance with data protection standards while maintaining optimal system performance.
  technologies:
    - Java
    - Spring Boot
    - AES-256 Encryption
    - PostgreSQL
  image: encryption.png
  highlights:
    - Successfully implemented comprehensive PII protection system
    - Achieved full compliance with data protection regulations
    - Enhanced customer trust through improved data security
    - Implemented field-level encryption without impacting system performance

- title: GCP Datastore to PostgreSQL Migration
  description: Successfully migrated data from Google Cloud Datastore to PostgreSQL while maintaining application availability with zero downtime. The migration improved database performance and reduced operational costs.
  technologies:
    - Java
    - GCP Datastore
    - PostgreSQL
    - Docker
  image: migration.png
  highlights:
    - Successfully completed zero-downtime migration
    - Improved system reliability and performance
    - Reduced operational costs through optimized database structure
    - Enhanced data consistency and integrity
    - Implemented robust data validation processes

- title: Alerta - Incident Management System
  description: Developed an incident management application MVP aimed at replacing OpsGenie. Provides real-time monitoring, alerting, and incident resolution with Slack and Jira integrations.
  technologies:
    - Golang
    - GCP
    - Kubernetes
    - Helm
    - Terraform
    - React.js
    - React Native
    - Slack API
    - Jira API
  image: alerta.png
  highlights:
    - Centralized incident monitoring dashboard
    - Real-time alerting system
    - On-call scheduling and escalation policies
    - Integration with Slack and Jira for streamlined workflows

- title: Angkat Tani - Agricultural Support System
  description: Indonesia is the largest tropical agricultural country in the world after Brazil. However, with such a large agricultural potential, Indonesia is still behind in exporting agricultural products compared to several other countries because it is lagging in terms of supporting technology. Angkat Tani addresses these challenges by providing tools to predict crop prices and detect plant diseases.
  technologies:
    - Python
    - Google Cloud Platform
    - Machine Learning
    - Android Development
    - Web Development
  image: angkat-tani.png
  highlights:
    - Crop price prediction using historical data analysis
    - Plant disease detection from leaf photos
    - Available as both Android and web applications
    - Helps farmers make informed decisions about what crops to plant
    - Supports appropriate treatment selection for crop diseases
